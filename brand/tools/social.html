<!-- Ruled's social card, 1200 by 630: render.mjs makes brand/ruled-social.png from it. -->
<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:Fraunces;src:url(../../docs/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-normal.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Fraunces;src:url(../../docs/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-italic.woff2) format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:Plex;src:url(../../docs/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:PlexMono;src:url(../../docs/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#FBF9F4;color:#101A16;font-family:Plex}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(16,26,22,.07) 1px,transparent 1px),linear-gradient(to bottom,rgba(16,26,22,.07) 1px,transparent 1px);background-size:96px 32px;background-position:-1px 15px}
.margin{position:absolute;top:0;bottom:0;left:118px;width:4px;background:#E0412A}
.cols{position:absolute;top:0;left:122px;right:0;height:32px;display:flex;font:500 13px PlexMono;color:#7d8780}
.cols span{width:96px;text-align:center;line-height:32px}
.content{position:absolute;left:170px;top:118px;right:80px}
.lockup{height:84px;display:block}
h1{margin:44px 0 0;font:600 76px/1.02 Fraunces;font-variation-settings:'opsz' 144,'SOFT' 30;letter-spacing:-.02em}
h1 em{font-style:italic;color:#0B6B4F;font-variation-settings:'opsz' 144,'SOFT' 100}
p{margin:26px 0 0;font:500 21px PlexMono;color:#4c5a52;letter-spacing:.01em}
.cell{position:absolute;right:96px;bottom:64px;width:190px;height:64px;border:4px solid #0B6B4F;border-radius:3px;background:rgba(11,107,79,.07);display:flex;align-items:center;justify-content:center;font:600 26px PlexMono;color:#0B6B4F}
.cell::after{content:'';position:absolute;right:-9px;bottom:-9px;width:12px;height:12px;background:#0B6B4F;border:3px solid #FBF9F4}
.cell::before{content:'';position:absolute;right:-4px;top:-4px;border-style:solid;border-width:0 18px 18px 0;border-color:transparent #E0412A transparent transparent}
</style>
<div class="grid"></div><div class="margin"></div>
<div class="cols"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span><span>I</span><span>J</span><span>K</span></div>
<div class="content">
<img class="lockup" src="../ruled-lockup.svg">
<h1>Spreadsheets that<br><em>know the rules.</em></h1>
<p>Excel in your app · schemas · async checks · .xlsx back intact</p>
</div>
<div class="cell">SKU-2001</div>
