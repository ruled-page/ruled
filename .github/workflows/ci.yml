name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, unit tests, builds and round trips
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # openpyxl gives the round-trip check a second, independent reading of each saved file.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: npm ci
      - run: npm run typecheck
      # Unit tests, failing if coverage of the logic drops (the screens are covered by the e2e job).
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run build:lib
      - run: npm run build:node
      - name: Round-trip the sample workbooks
        run: node dist-node/verify.js public/samples --structure
      # Microsoft's Open XML SDK checks every saved copy is as valid as its original.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm run validate:saves

  e2e:
    name: End-to-end, keyboard and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  examples:
    name: Angular example and a React app using the package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Angular's CLI needs a newer Node 22 than the rest of the project.
          node-version-file: examples/angular/.node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/angular/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: examples/angular
      - run: npm run build:lib
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/angular.spec.ts e2e/package.spec.ts
        env:
          E2E_ANGULAR: '1'
          E2E_HOST_APP: '1'
      # The three example sites, built as Cloudflare Pages would serve them (not deployed).
      - run: npm run build:sites
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-angular
          path: |
            playwright-report
            test-results
          retention-days: 7
